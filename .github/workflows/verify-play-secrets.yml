name: Verify Play signing secrets (no release)
on:
  push:
    branches: [verify-play-secrets]
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets and sign a disposable probe
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_PASSWORD PLAY_UPLOAD_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name"; exit 1
            fi
            echo "$name is configured"
          done
          if [[ "$PLAY_UPLOAD_KEY_ALIAS" != 'clashtimerhub-upload' ]]; then
            echo '::error::Incorrect alias'; exit 1
          fi
          if [[ "$PLAY_UPLOAD_KEY_PASSWORD" != "$PLAY_UPLOAD_STORE_PASSWORD" ]]; then
            echo '::error::The two passwords must match for this PKCS12 key'; exit 1
          fi
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          if ! printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$work/key.p12" 2>/dev/null; then
            echo '::error::Invalid Base64 keystore'; exit 1
          fi
          unset PLAY_UPLOAD_KEYSTORE_BASE64
          if [[ "$(sha256sum "$work/key.p12" | cut -d ' ' -f 1)" != '298a310f26bbd78ada1542e5a635543f37483da66cd885965b64b860cc4833dd' ]]; then
            echo '::error::Decoded keystore differs from the exact locally verified PKCS12 file'; exit 1
          fi
          echo 'Decoded keystore exactly matches the locally verified file'
          if [[ "$PLAY_UPLOAD_STORE_PASSWORD" == *$'\n'* || "$PLAY_UPLOAD_STORE_PASSWORD" == *$'\r'* ]]; then
            echo '::error::Password contains a line break; paste only the password'; exit 1
          fi
          if ! keytool -exportcert -storetype PKCS12 -keystore "$work/key.p12" -storepass:env PLAY_UPLOAD_STORE_PASSWORD -alias "$PLAY_UPLOAD_KEY_ALIAS" -file "$work/cert.der" >/dev/null 2>&1; then
            echo '::error::Cannot open PKCS12 with the configured password and alias'; exit 1
          fi
          actual=$(sha256sum "$work/cert.der" | cut -d ' ' -f 1)
          if [[ "$actual" != '27c6966ac498f8f2ee90066bc9778702671ab6236c960ee43163b71ebfece6f0' ]]; then
            echo '::error::Certificate differs from the new upload certificate'; exit 1
          fi
          echo 'New upload certificate matches'
          printf 'Local signing verification only\n' > "$work/probe.txt"
          jar --create --file "$work/probe.jar" -C "$work" probe.txt
          if ! jarsigner -storetype PKCS12 -keystore "$work/key.p12" -storepass:env PLAY_UPLOAD_STORE_PASSWORD -keypass:env PLAY_UPLOAD_KEY_PASSWORD "$work/probe.jar" "$PLAY_UPLOAD_KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::Private-key signing failed'; exit 1
          fi
          jarsigner -verify "$work/probe.jar" >/dev/null 2>&1
          echo 'PASS: all four secrets and private-key signing verified. No app built or published.'

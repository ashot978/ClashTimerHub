name: Build signed Google Play bundle

on:
  push:
    branches: [main]
    paths: [.github/play-version-code]
  workflow_dispatch:
    inputs:
      version_code:
        description: Android version code greater than every code already used in Play Console
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clashtimerhub-play-bundle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      PLAY_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - name: Select explicitly requested Play version
        run: |
          if [[ -z "$PLAY_VERSION_CODE" ]]; then
            echo "PLAY_VERSION_CODE=$(cat .github/play-version-code)" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test the Play release
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$PLAY_VERSION_CODE" =~ ^[1-9][0-9]{3,9}$ ]] ||
             (( PLAY_VERSION_CODE <= 1575 || PLAY_VERSION_CODE > 2100000000 )); then
            echo "::error::Set a valid Play version code above 1575 and above all codes used in Play Console."
            exit 1
          fi
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret $name for the original AshLab Play upload key."
              exit 1
            fi
          done
          umask 077
          PLAY_UPLOAD_KEYSTORE_PATH="$(mktemp --suffix=.p12 "$RUNNER_TEMP/play-upload.XXXXXX")"
          export PLAY_UPLOAD_KEYSTORE_PATH
          trap 'rm -f "$PLAY_UPLOAD_KEYSTORE_PATH"' EXIT
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$PLAY_UPLOAD_KEYSTORE_PATH"
          unset PLAY_UPLOAD_KEYSTORE_BASE64
          gradle --no-daemon "-PplayVersionCode=$PLAY_VERSION_CODE" :app:testPlayReleaseUnitTest :app:bundlePlayRelease
      - name: Verify the actual Play bundle
        run: |
          set -euo pipefail
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar \
            --output "$bundletool"
          echo "675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  $bundletool" | sha256sum --check
          bash .github/scripts/verify-play-bundle.sh app/build/outputs/bundle/playRelease/app-play-release.aab "$bundletool" "$PLAY_VERSION_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: ClashTimerHub-Play-AAB-${{ env.PLAY_VERSION_CODE }}
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

name: Inspect Android scanner source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-inspection.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          cat source/chunk*.b64 | base64 --decode > /tmp/source.tar.xz
          tar -xJf /tmp/source.tar.xz
      - name: Print relevant source
        run: |
          echo '===== ProjectionScanService ====='
          cat app/src/main/java/nl/clashtimerhub/app/ProjectionScanService.java
          echo '===== MainActivity ====='
          cat app/src/main/java/nl/clashtimerhub/app/MainActivity.java
          echo '===== Manifest ====='
          cat app/src/main/AndroidManifest.xml

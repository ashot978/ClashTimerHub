name: Verify monetization closed-test branch
on:
  push:
    branches: [feature/monetization-closed-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate isolated disposable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -storetype JKS -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey -keyalg RSA \
              -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null
          echo 'Disposable debug key ready; no release signing secrets used.'
      - name: Compile both variants and test
        run: gradle --no-daemon :app:testPlayDebugUnitTest :app:assemblePlayDebug :app:testGithubDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Monetization-test-debug-APK-not-for-Play-upload
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error

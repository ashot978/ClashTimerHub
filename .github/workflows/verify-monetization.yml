name: Verify monetization closed-test branch
on:
  push:
    branches: [feature/monetization-closed-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile both variants and test
        run: gradle --no-daemon :app:testPlayDebugUnitTest :app:assemblePlayDebug :app:testGithubDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Monetization-test-debug-APK-not-for-Play-upload
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error

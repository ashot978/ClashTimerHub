name: Verify monetization closed-test branch
on:
  push:
    branches: [feature/monetization-closed-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate isolated disposable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -storetype JKS -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey -keyalg RSA \
              -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null
          echo 'Disposable debug key ready; no release signing secrets used.'
      - name: Compile both variants and test
        run: gradle --no-daemon -PisolatedPreview=true -PplayVersionCode=1579 :app:testPlayDebugUnitTest :app:assemblePlayDebug :app:testGithubDebugUnitTest
      - name: Verify isolated APK and debug signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/play/debug/app-play-debug.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/preview-badging.txt"
          grep -F "package: name='nl.clashtimerhub.app.preview'" "$RUNNER_TEMP/preview-badging.txt"
          grep -F "application-label:'Clash Timer Hub Preview'" "$RUNNER_TEMP/preview-badging.txt"
          "$(dirname "$aapt")/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/ClashTimerHub-Roadmap-Preview2.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ClashTimerHub-Roadmap-Preview2-APK
          path: ${{ runner.temp }}/ClashTimerHub-Roadmap-Preview2.apk
          if-no-files-found: error

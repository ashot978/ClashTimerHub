name: Build Clash Timer Hub V7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

# Only the most recent push should publish a public APK.
concurrency:
  group: clashtimerhub-apk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore existing Android signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: clashtimerhub-debug-signing-v1
      - name: Verify original signing key is present
        run: |
          test -f "$HOME/.android/debug.keystore" || { echo 'ERROR: Existing signing key missing; refusing to create incompatible APK'; exit 1; }
          echo "Signing certificate (for the Google Cloud Android OAuth client):"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E 'SHA1:|SHA256:'
      - name: Set version for upgrade
        run: sed -i -E "s/versionCode [0-9]+/versionCode $((1000 + ${{ github.run_number }}))/" app/build.gradle
      - name: Build new app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify actual APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$signer" || { echo 'ERROR: Android apksigner missing'; exit 1; }
          "$signer" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/clash-apk-verification.txt
          expected="d2ee752fb5224958db8db8cc1b8e9d189376c1da075cf741056870bfd43ceb10"
          grep -iF "certificate SHA-256 digest: $expected" /tmp/clash-apk-verification.txt ||
            { echo 'ERROR: APK was not signed with the persistent ClashTimerHub certificate'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ClashTimerHubV7-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk ClashTimerHub.apk
          if test -f CHANGELOG.md; then
            awk 'BEGIN {part=0} /^## / {part++; if (part>1) exit} part==1 {print}' CHANGELOG.md > release-notes.md
          fi
          if ! test -s release-notes.md; then
            printf 'ClashTimerHub Android APK, build #%s.\n' "${GITHUB_RUN_NUMBER}" > release-notes.md
          fi
          echo "" >> release-notes.md
          printf 'Build #%s · Android versionCode %s.\n'             "${GITHUB_RUN_NUMBER}" "$((1000 + GITHUB_RUN_NUMBER))" >> release-notes.md
          printf 'Important: older APKs may have a different signing identity. Back up all accounts before reinstalling. Never uninstall without a verified backup.\n' >> release-notes.md
          gh release create "build-${GITHUB_RUN_NUMBER}" "./ClashTimerHub.apk"             --title "ClashTimerHub build #${GITHUB_RUN_NUMBER}"             --notes-file release-notes.md             --latest             --target "${GITHUB_SHA}"

name: Build Clash Timer Hub V2
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore existing Android signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: clashtimerhub-debug-signing-v1
      - name: Verify original signing key is present
        run: |
          test -f "$HOME/.android/debug.keystore" || { echo 'ERROR: Existing signing key missing; refusing to create incompatible APK'; exit 1; }
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep 'SHA256:'
      - name: Set version for upgrade
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
      - name: Build new app
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ClashTimerHubV2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

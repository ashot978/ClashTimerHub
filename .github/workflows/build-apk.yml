name: Build Android test APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore Android project from source archive
        shell: bash
        run: |
          cat source/chunk*.b64 | base64 --decode > /tmp/clashtimerhub-sources.tar.xz
          echo "0264159ac49365a072922cf1b78babe7ea67f736d378aba703ead2384238a430  /tmp/clashtimerhub-sources.tar.xz" | sha256sum --check
          tar -xJf /tmp/clashtimerhub-sources.tar.xz -C .
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 build dependencies
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ClashTimerHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

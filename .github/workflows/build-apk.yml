name: Build Android test APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore Android project from source archive
        shell: bash
        run: |
          cat source/chunk*.b64 | base64 --decode > /tmp/clashtimerhub-sources.tar.xz
          echo "0264159ac49365a072922cf1b78babe7ea67f736d378aba703ead2384238a430  /tmp/clashtimerhub-sources.tar.xz" | sha256sum --check
          tar -xJf /tmp/clashtimerhub-sources.tar.xz -C .
      - name: Validate patch syntax
        run: python3 -m py_compile patches/apply_patch.py
      - name: Inspect source lifecycle signatures
        run: |
          grep -n -E 'onCreate|OcrScanner.scan|onResult|setOnClickListener|setOnItemClickListener|setName|save|Opslaan|account|Account|EditText' app/src/main/java/nl/clashtimerhub/app/MainActivity.java || true
          sed -n '1,240p' app/src/main/java/nl/clashtimerhub/app/MainActivity.java
      - name: Apply OCR menu safety patch
        run: |
          cp -r patches/app/src/main/java/nl/clashtimerhub/app/*.java app/src/main/java/nl/clashtimerhub/app/
          python3 patches/apply_patch.py 2>&1 | tee /tmp/clash-patch.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Report patch failure to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '~~~'
            tail -c 12000 /tmp/clash-patch.log 2>/dev/null || true
            echo '~~~'
          } > /tmp/clash-patch-issue.txt
          gh issue create --title "Android CI failure: patch #${{ github.run_number }}" --body-file /tmp/clash-patch-issue.txt || true
      - name: Set incrementing Android version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '0.3.${{ github.run_number }}'/" app/build.gradle
          grep -E 'versionCode|versionName' app/build.gradle
      - name: Inspect scanner service
        run: sed -n '1,260p' app/src/main/java/nl/clashtimerhub/app/ProjectionScanService.java
      - name: Run pure Java regression tests
        run: |
          mkdir -p /tmp/clash-tests
          javac -d /tmp/clash-tests \
            app/src/main/java/nl/clashtimerhub/app/TimerParser.java \
            app/src/main/java/nl/clashtimerhub/app/MenuTimerDetector.java \
            app/src/main/java/nl/clashtimerhub/app/BuilderAvailability.java \
            tests/TimerParserTest.java \
            patches/tests/MenuTimerDetectorTest.java \
            patches/tests/BuilderAvailabilityTest.java
          java -cp /tmp/clash-tests TimerParserTest
          java -cp /tmp/clash-tests MenuTimerDetectorTest
          java -cp /tmp/clash-tests BuilderAvailabilityTest
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 build dependencies
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: clashtimerhub-debug-signing-v1
      - name: Ensure persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E 'SHA256:|Alias name:'
      - name: Compile debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/clash-gradle.log
      - name: Report compile failure to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/clash-gradle.log ]; then
            tail -c 12000 /tmp/clash-gradle.log > /tmp/clash-error.txt
            gh issue create --title "Android CI failure: compile #${{ github.run_number }}" --body-file /tmp/clash-error.txt || true
          fi
      - name: Report successful APK build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Android APK build SUCCESS #${{ github.run_number }}" --body "Successful run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ClashTimerHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

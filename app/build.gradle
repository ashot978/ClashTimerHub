plugins { id 'com.android.application' }
android { namespace 'nl.clashtimerhub.v2'; compileSdk 35
 defaultConfig { applicationId 'nl.clashtimerhub.app'; minSdk 26; targetSdk 35; versionCode 1003; versionName '7.5.20-beta1' }
 // Bundle the same Markdown file as GitHub: one roadmap source, offline in app.
 // The CI restore step puts the permanent identity here. Do not let Gradle
 // generate a fresh, unrelated debug certificate for each build.
 signingConfigs {
  debug {
   storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 if (System.getenv('PLAY_UPLOAD_KEYSTORE_PATH')) {
  signingConfigs {
   playUpload {
    storeFile file(System.getenv('PLAY_UPLOAD_KEYSTORE_PATH'))
    storePassword System.getenv('PLAY_UPLOAD_STORE_PASSWORD')
    keyAlias System.getenv('PLAY_UPLOAD_KEY_ALIAS')
    keyPassword System.getenv('PLAY_UPLOAD_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug { signingConfig signingConfigs.debug }
  release {
   if (System.getenv('PLAY_UPLOAD_KEYSTORE_PATH')) signingConfig signingConfigs.playUpload
   minifyEnabled false
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1'; implementation 'com.google.android.gms:play-services-auth:22.0.0'; implementation 'com.squareup.okhttp3:okhttp:4.12.0'; implementation 'androidx.core:core:1.16.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }

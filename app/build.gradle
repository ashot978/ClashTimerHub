plugins { id 'com.android.application' }
android { namespace 'nl.clashtimerhub.v2'; compileSdk 35
 defaultConfig { applicationId 'nl.clashtimerhub.app'; minSdk 26; targetSdk 35; versionCode 1003; versionName '7.5.13-beta1' }
 // The CI restore step puts the permanent identity here. Do not let Gradle
 // generate a fresh, unrelated debug certificate for each build.
 signingConfigs {
  debug {
   storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 buildTypes { debug { signingConfig signingConfigs.debug } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1'; implementation 'com.google.android.gms:play-services-auth:22.0.0'; implementation 'com.squareup.okhttp3:okhttp:4.12.0'; implementation 'androidx.core:core:1.16.0'; testImplementation 'junit:junit:4.13.2' }

plugins { id 'com.android.application' }

def playKeystore = System.getenv('PLAY_UPLOAD_KEYSTORE_PATH')
def playVersion = providers.gradleProperty('playVersionCode')
// Never enable the purchase flow in a shared test build unless every tester is a Play license tester.
def testPurchases = providers.gradleProperty('enableMonetizationTestPurchases').orElse('false').get() == 'true'
def isolatedPreview = providers.gradleProperty('isolatedPreview').orElse('false').get() == 'true'
if (isolatedPreview && testPurchases) throw new GradleException('Isolated previews must never enable purchases.')
android { namespace 'nl.clashtimerhub.v2'; compileSdk 36
 defaultConfig {
  applicationId 'nl.clashtimerhub.app'; minSdk 26; targetSdk 35; versionCode 1003; versionName '7.5.20-beta1'
  manifestPlaceholders = [appLabel: 'Clash Timer Hub']
  buildConfigField 'boolean', 'ISOLATED_PREVIEW', 'false'
 }
 // Bundle the same Markdown file as GitHub: one roadmap source, offline in app.
 // The CI restore step puts the permanent identity here. Do not let Gradle
 // generate a fresh, unrelated debug certificate for each build.
 signingConfigs {
  debug {
   storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 if (playKeystore) {
  signingConfigs {
   playUpload {
    storeType 'PKCS12'
    storeFile file(playKeystore)
    storePassword System.getenv('PLAY_UPLOAD_STORE_PASSWORD')
    keyAlias System.getenv('PLAY_UPLOAD_KEY_ALIAS')
    keyPassword System.getenv('PLAY_UPLOAD_KEY_PASSWORD')
   }
  }
 }
 buildFeatures { buildConfig true }
 flavorDimensions 'distribution'
 productFlavors {
  github { dimension 'distribution'; buildConfigField 'boolean', 'GITHUB_UPDATES', 'true' }
  play {
   dimension 'distribution'
   buildConfigField 'boolean', 'GITHUB_UPDATES', 'false'
   buildConfigField 'boolean', 'MONETIZATION_TEST_PURCHASES', testPurchases.toString()
   targetSdk 36
   versionName '7.5.20-play-beta5'
   if (playVersion.isPresent()) versionCode playVersion.get().toInteger()
   if (playKeystore) signingConfig signingConfigs.playUpload
  }
 }
 buildTypes {
  debug {
   signingConfig signingConfigs.debug
   if (isolatedPreview) {
    applicationIdSuffix '.preview'
    versionNameSuffix '-roadmap-preview2'
    manifestPlaceholders = [appLabel: 'Clash Timer Hub Preview']
    buildConfigField 'boolean', 'ISOLATED_PREVIEW', 'true'
   }
  }
  release {
   minifyEnabled false
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 playImplementation 'com.google.android.play:app-update:2.1.0'
 playImplementation 'com.google.android.gms:play-services-ads:25.4.0'
 playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
 playImplementation 'com.android.billingclient:billing:8.3.0'
 implementation 'com.google.mlkit:text-recognition:16.0.1'; implementation 'com.google.android.gms:play-services-auth:22.0.0'; implementation 'com.squareup.okhttp3:okhttp:4.12.0'; implementation 'androidx.core:core:1.16.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
